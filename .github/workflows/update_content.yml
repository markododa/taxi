name: Update Content Script Output on Pull Request

on:
  pull_request:
    branches:
      - main # or any other branch you want to target

workflow: # <--- Add a key here!
jobs:
  update-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run content script output command
        run: make html

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: github.com/${{github.repository}}/gh-pages
        run: |
          git add .
          git commit -m "Update content"
          git subtree push --prefix public origin ${REPO_NAME} gh-pages HEAD:${REPO_NAME}/gh-pages # This assumes your content script writes to the current directory (HEAD). Adjust paths if necessary based on where it outputs files.
